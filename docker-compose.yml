version: '3.8'
services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongo:27017/inventory_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=dev_jwt_secret
      - SESSION_SECRET=dev_session_secret
    depends_on:
      - mongo
      - redis
  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  mongo_data:
